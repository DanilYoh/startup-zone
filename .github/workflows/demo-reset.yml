name: Reset isolated demo data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: demo-data-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Demo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Check demo environment
        id: preflight
        env:
          DEMO_SEED_PROJECT_REF: ${{ vars.DEMO_SEED_PROJECT_REF }}
          LEGAL_DOCUMENT_VERSION: ${{ vars.LEGAL_DOCUMENT_VERSION }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_FOUNDER_EMAIL: ${{ vars.DEMO_FOUNDER_EMAIL }}
          DEMO_FOUNDER_PASSWORD: ${{ secrets.DEMO_FOUNDER_PASSWORD }}
          DEMO_INVESTOR_EMAIL: ${{ vars.DEMO_INVESTOR_EMAIL }}
          DEMO_INVESTOR_PASSWORD: ${{ secrets.DEMO_INVESTOR_PASSWORD }}
        run: node scripts/demo-reset-preflight.mjs
      - name: Install dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: npm ci --ignore-scripts
      - name: Reset synthetic demo records
        if: steps.preflight.outputs.configured == 'true'
        env:
          APP_ENVIRONMENT: demo
          ALLOW_DEMO_SEED: "true"
          DEMO_SEED_PROJECT_REF: ${{ vars.DEMO_SEED_PROJECT_REF }}
          LEGAL_DOCUMENT_VERSION: ${{ vars.LEGAL_DOCUMENT_VERSION }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_FOUNDER_EMAIL: ${{ vars.DEMO_FOUNDER_EMAIL }}
          DEMO_FOUNDER_PASSWORD: ${{ secrets.DEMO_FOUNDER_PASSWORD }}
          DEMO_INVESTOR_EMAIL: ${{ vars.DEMO_INVESTOR_EMAIL }}
          DEMO_INVESTOR_PASSWORD: ${{ secrets.DEMO_INVESTOR_PASSWORD }}
        run: npm run demo:seed
