name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENVIRONMENT: test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com
      RELEASE_VERSION: ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check Markdown links
        run: npm run docs:links
      - name: Lint, type-check, and test
        run: npm run check
      - name: Enforce test coverage thresholds
        run: npm run test:coverage
      - name: Build production bundle
        run: npm run build
      - name: Validate and build production container
        run: |
          docker compose --env-file .env.example -f compose.production.yaml config --quiet
          docker run --rm \
            --env APP_DOMAIN=app.example.com \
            --env SUPABASE_DOMAIN=api.example.com \
            --env SUPABASE_UPSTREAM=host.docker.internal:8000 \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg RELEASE_VERSION="$RELEASE_VERSION" \
            --tag startup-zone:ci \
            .
      - name: Save production container
        run: docker save startup-zone:ci --output /tmp/startup-zone-image.tar
      - name: Scan production container
        run: |
          docker run --rm \
            --volume /tmp:/scan \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --input /scan/startup-zone-image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      - name: Generate container SBOM
        run: |
          docker run --rm \
            --volume /tmp:/scan \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --input /scan/startup-zone-image.tar --format cyclonedx --output /scan/startup-zone.cdx.json
      - name: Upload container SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: startup-zone-container-sbom
          path: /tmp/startup-zone.cdx.json
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Start local Supabase
        run: npx supabase start
      - name: Export local test environment
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "APP_ENVIRONMENT=local"
          } >> "$GITHUB_ENV"
      - name: Verify upgrade from the immutable April schema
        run: |
          # This destructive fixture is allowed only on the disposable local stack
          # started by this job. It is deliberately outside supabase/tests so a
          # remote `supabase test db` invocation can never discover it.
          npx supabase db reset --local --version 20260401102910 --sql-paths ./fixtures/upgrade/legacy-fixture.sql
          npx supabase migration up --local
          npx supabase test db supabase/tests/upgrade/verify.sql
      - name: Verify migrations on a clean database
        run: npx supabase db reset --local --no-seed
      - name: Verify generated database types
        run: npm run types:check
      - name: Test database authorization
        run: npm run test:rls
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test marketplace flows
        run: npm run test:e2e
